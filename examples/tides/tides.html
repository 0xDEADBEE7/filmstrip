<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidewatch</title>
<style>
  :root { --ink: #1d2433; --mute: #6b7489; --line: #e4e8f0; --bg: #f6f8fb; --card: #fff; --sea: #2f6fdb; --sea2: #dbe7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 28px; background: var(--card); border-bottom: 1px solid var(--line); }
  header b { font-size: 18px; letter-spacing: -0.01em; }
  header .dot { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(160deg, #7fb0ff, var(--sea)); }
  header .when { margin-left: auto; color: var(--mute); font-size: 13px; }
  main { padding: 22px 28px; }
  .search { width: 100%; padding: 11px 14px; font: inherit; border: 1px solid var(--line); border-radius: 10px; background: var(--card); outline: none; }
  .search:focus { border-color: var(--sea); box-shadow: 0 0 0 3px var(--sea2); }
  .list { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr 140px 140px 90px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row .name { font-weight: 600; }
  .row .sub { color: var(--mute); font-size: 13px; }
  .row .num { font-variant-numeric: tabular-nums; }
  .row .rise { color: #1f8a4c; } .row .fall { color: #c24b3a; }
  .empty { padding: 18px 16px; color: var(--mute); }
  .head { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 0 16px 6px; display: grid; grid-template-columns: 1fr 140px 140px 90px; margin-top: 16px; }
  #detail { display: none; }
  .back { display: inline-flex; gap: 6px; align-items: center; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font: inherit; font-size: 14px; cursor: pointer; }
  h1 { margin: 14px 0 2px; font-size: 26px; letter-spacing: -0.02em; }
  .meta { color: var(--mute); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .k { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 14px; color: var(--mute); font-weight: 500; }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 6px; }
  .chart svg { display: block; width: 100%; height: 210px; }
</style>
</head>
<body>
<header><span class="dot"></span><b>Tidewatch</b><span class="when" id="when"></span></header>
<main>
  <section id="home">
    <input id="search" class="search" placeholder="Search stations" autocomplete="off">
    <div class="head"><span>Station</span><span>Next high</span><span>Height</span><span>Trend</span></div>
    <div class="list" id="list"></div>
  </section>
  <section id="detail">
    <button class="back" id="back">← Stations</button>
    <h1 id="d-name"></h1>
    <div class="meta" id="d-meta"></div>
    <div class="stats">
      <div class="stat" id="next-high"><div class="k">Next high water</div><div class="v" id="d-high"></div></div>
      <div class="stat" id="next-low"><div class="k">Next low water</div><div class="v" id="d-low"></div></div>
      <div class="stat"><div class="k">Range today</div><div class="v" id="d-range"></div></div>
    </div>
    <div class="chart" id="chart"><svg id="svg" viewBox="0 0 1000 210" preserveAspectRatio="none"></svg></div>
  </section>
</main>
<script>
// Invented figures for a demo: not real predictions.
const S = [
  ["Aberdeen", "North Sea", "14:05", 4.3, 1, 2.1, 0.4],
  ["Dover", "Strait of Dover", "11:42", 6.6, 1, 0.3, 1.2],
  ["Falmouth", "Western Channel", "09:18", 5.1, -1, 4.2, 2.0],
  ["Oban", "Firth of Lorn", "16:27", 3.9, 1, 1.4, 3.1],
  ["Portland", "Weymouth Bay", "13:56", 2.2, 1, 3.6, 4.4],
  ["Porthcawl", "Bristol Channel", "10:33", 9.4, -1, 5.0, 5.2],
  ["Portsmouth", "The Solent", "12:48", 4.8, 1, 2.7, 0.9],
  ["Whitby", "North Yorkshire", "15:10", 5.3, -1, 0.9, 2.6],
];
const $ = id => document.getElementById(id);
$("when").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
function list(q) {
  const rows = S.filter(s => s[0].toLowerCase().includes(q.toLowerCase()));
  $("list").innerHTML = rows.length ? rows.map(s => `
    <div class="row" data-name="${s[0]}"><div><div class="name">${s[0]}</div><div class="sub">${s[1]}</div></div>
    <div class="num">${s[2]}</div><div class="num">${s[3].toFixed(1)} m</div>
    <div class="${s[4] > 0 ? "rise" : "fall"}">${s[4] > 0 ? "▲ rising" : "▼ falling"}</div></div>`).join("")
    : `<div class="empty">No station matches “${q}”.</div>`;
}
function curve(s) {
  const pts = [];
  for (let i = 0; i <= 96; i++) {
    const t = i / 96 * 24, h = s[3] / 2 + s[3] / 2 * Math.cos((t - s[5] * 2.6) / 12.42 * 2 * Math.PI) * (0.92 + 0.08 * Math.cos(t / 3 + s[6]));
    pts.push([i / 96 * 1000, 190 - h / 10 * 170]);
  }
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const grid = [0, 6, 12, 18, 24].map(h => `<line x1="${h / 24 * 1000}" x2="${h / 24 * 1000}" y1="10" y2="190" stroke="#e4e8f0"/>
    <text x="${h / 24 * 1000 + 4}" y="205" font-size="11" fill="#6b7489">${String(h).padStart(2, "0")}:00</text>`).join("");
  return grid + `<path d="${line} L1000 190 L0 190 Z" fill="#dbe7fb" opacity=".7"/><path d="${line}" fill="none" stroke="#2f6fdb" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
}
function open(name) {
  const s = S.find(s => s[0] === name);
  $("d-name").textContent = s[0];
  $("d-meta").textContent = s[1] + " · heights above chart datum";
  $("d-high").innerHTML = `${s[2]} <small>${s[3].toFixed(1)} m</small>`;
  const [h, m] = s[2].split(":").map(Number), low = (h * 60 + m + 372) % 1440;
  $("d-low").innerHTML = `${String(Math.floor(low / 60)).padStart(2, "0")}:${String(low % 60).padStart(2, "0")} <small>${(s[3] * 0.12).toFixed(1)} m</small>`;
  $("d-range").innerHTML = `${(s[3] * 0.88).toFixed(1)} <small>m</small>`;
  $("svg").innerHTML = curve(s);
  $("home").style.display = "none"; $("detail").style.display = "block";
}
$("search").addEventListener("input", e => list(e.target.value));
$("list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) open(r.dataset.name); });
$("back").addEventListener("click", () => { $("detail").style.display = "none"; $("home").style.display = "block"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("search").value = ""; list(""); $("search").blur(); } });
list("");
</script>
</body>
</html>
